<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>{{ page.title }} | {{ site.title }}</title>
        
        <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}">
        <meta name="author" content="{{ site.author }}">
        <meta name="generator" content="Jekyll">

        <link rel="canonical" href="{{ page.url | absolute_url }}">
        <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
        
        <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
        <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
        <meta property="og:description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}">
        <meta property="og:url" content="{{ page.url | absolute_url }}">
        <meta property="og:site_name" content="{{ site.title }}">
        <meta name="twitter:card" content="summary">
        <meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
        <meta name="twitter:description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}">

        {% if page.layout == 'post' %}
            <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
            {% if page.author %}
                <meta property="article:author" content="{{ page.author }}">
            {% endif %}
        {% endif %}
    </head>

    <body>
        <header>
            <nav>
                <a href="{{ '/' | relative_url }}"><strong>{{ site.title }}</strong></a>
                <!-- <a href="https://las-r.github.io">Portfolio</a> -->
            </nav>
        </header>

        <main>
            {{ content }}
        </main>

        <footer>
            <p>&copy; {{ site.time | date: "%Y" }} {{ site.author }} <br> <a href="https://github.com/las-r">GitHub</a></p>
        </footer>
    </body>
</html>
