---
layout: default
---
<article>
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%B %d, %Y" }}
    </time>
    
    <hr>

    <div class="post-content">
        {{ content }}
    </div>
</article>

<aside class="toc" id="toc">
    <h2>Contents</h2>
    <ul id="toc-list"></ul>
</aside>

<script src="{{ '/assets/js/toc.js' | relative_url }}"></script>
