# site settings
title: "las-r / blog"
author: "Nayif Ehan"
description: "A collection of my thoughts."

# url settings
url: "https://las-r.github.io"
baseurl: "/blog"

# build settings
markdown: kramdown
highlighter: rouge
kramdown:
    syntax_highlighter: rouge
permalink: /:title/
livereload: true

# exclusions
exclude:
    - Gemfile
    - Gemfile.lock
    - node_modules/
    - vendor/bundle/
    - vendor/cache/
    - vendor/gems/
    - vendor/ruby/
    - README.md
    - LICENSE

# plugins
plugins:
  - jekyll-sitemap